<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Detail | FREEDAM DAO</title>
  <meta name="description" content="Policy Aura Market detail: plain-language summary, exact resolution condition, member conviction totals.">
  <link rel="stylesheet" href="/assets/fd.css">
</head>
<body class="fd-body">
  <nav class="fd-nav">
    <a class="fd-logo" href="/">FREEDAM<span class="fd-latch">DAO</span></a>
    <div>
      <a href="/markets/">← All markets</a>
      <a href="/ledger/">Ledger</a>
    </div>
  </nav>

  <main class="fd-main">
    <div id="market-root">
      <p class="fd-sub" role="status">Loading market…</p>
    </div>
    <noscript><p>This page needs JavaScript to show market details. The raw data is available as
      <a href="/data/markets.json">static JSON</a>.</p></noscript>
  </main>

  <footer class="fd-footer">
    <p>
      <span class="fd-footer-motion"></span>
      · <a href="/data/markets.json">Raw market data (JSON)</a>
      · <a href="/assets/THIRD_PARTY_NOTICES.md">Third-party notices</a>
    </p>
    <p>FREEDAM DAO is a non-partisan civic movement. This is not a market for money; Aura cannot be bought or cashed out.</p>
  </footer>

  <script src="/assets/fd.js"></script>
  <script>
    (function () {
      'use strict';
      var root = document.getElementById('market-root');
      var params = new URLSearchParams(location.search);
      var id = params.get('id') || '';
      // Strict id validation: PM-### only, so nothing unvalidated reaches textContent sinks.
      if (!/^PM-[0-9]{3}$/.test(id)) {
        root.innerHTML = '<h1 class="fd-h1">Market not found</h1><p class="fd-sub">Use the <a href="/markets/">market listing</a> to pick a market.</p>';
        return;
      }
      fetch('/data/markets.json').then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function (data) {
        var m = data.markets.find(function (x) { return x.id === id; });
        if (!m) {
          root.innerHTML = '<h1 class="fd-h1">Market not found</h1><p class="fd-sub">Use the <a href="/markets/">market listing</a> to pick a market.</p>';
          return;
        }
        document.title = m.id + ' · ' + m.title + ' | FREEDAM DAO';
        var el = document.createElement('div');
        var kick = document.createElement('p');
        kick.className = 'fd-kicker';
        kick.textContent = m.id + ' · ' + m.jurisdiction;
        var h = document.createElement('h1');
        h.className = 'fd-h1';
        h.textContent = m.title;
        el.appendChild(kick); el.appendChild(h);
        el.appendChild(window.fdLCD(m.state,
          m.state === 'open' ? 'STAKE WINDOW ENDS ' + m.stake_window_ends.slice(0, 10) : ''));
        if (m.state === 'open' || m.state === 'stalled') {
          var meterPanel = document.createElement('div');
          meterPanel.className = 'fd-panel';
          var meterLabel = document.createElement('h2');
          meterLabel.style.fontSize = '1rem'; meterLabel.style.marginTop = '0';
          meterLabel.textContent = 'Member conviction';
          meterPanel.appendChild(meterLabel);
          meterPanel.appendChild(window.fdMeter(m.totals));
          el.appendChild(meterPanel);
        }
        var defs = document.createElement('dl');
        function row(dt, ddHtml) {
          var d = document.createElement('div');
          d.className = 'fd-defrow';
          var t = document.createElement('dt'); t.textContent = dt;
          var v = document.createElement('dd'); v.innerHTML = ddHtml;
          d.appendChild(t); d.appendChild(v); defs.appendChild(d);
        }
        function esc(s) {
          return String(s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
          });
        }
        row('In plain language', esc(m.summary_plain));
        row('Policy under watch', '<a href="' + esc(m.policy_link) + '" rel="noopener noreferrer">View the source policy ↗</a>');
        row('Resolves YES if…', esc(m.condition));
        row('Resolution source', esc(m.resolution_source));
        row('Opens', esc(m.opens_at.slice(0, 10)));
        row('Stake window ends', esc(m.stake_window_ends.slice(0, 10)));
        row('Deadline', esc(m.deadline.slice(0, 10)));
        row('Data as of', esc(m.data_as_of));
        el.appendChild(defs);
        var note = document.createElement('div');
        note.className = 'fd-panel';
        // Resolution readout — "Our members called it" (increment 4)
        if (m.state === 'resolved_yes' || m.state === 'resolved_no') {
          var called = document.createElement('div');
          called.className = 'fd-panel';
          var ch = document.createElement('h2');
          ch.style.fontSize = '1.1rem'; ch.style.marginTop = '0';
          ch.textContent = 'Our members called it';
          called.appendChild(ch);
          var cr = document.createElement('p');
          cr.className = 'fd-sub';
          var outcomeTxt = m.state === 'resolved_yes' ? 'RESOLVED · YES' : 'RESOLVED · NO';
          cr.textContent = 'Outcome: ' + outcomeTxt + '. Verified against the resolution source' +
            (m.resolution && m.resolution.source_url ? ' (' + m.resolution.source_url + ')' : '') + '. ' +
            'The members who called it correctly are credited on the public ledger — ' +
            'see /ledger/ for the “our members called it” board.';
          called.appendChild(cr);
          el.appendChild(called);
        } else if (m.state === 'unresolved') {
          var dead = document.createElement('div');
          dead.className = 'fd-panel';
          dead.appendChild(Object.assign(document.createElement('h2'), { textContent: 'Market closed — unresolved', style: 'font-size:1.1rem;margin-top:0' }));
          dead.appendChild(Object.assign(document.createElement('p'), { className: 'fd-sub', textContent: 'This market was closed without an outcome. Every stake was fully refunded (no fees exist off-chain).' }));
          el.appendChild(dead);
        }
        var stakeable = (m.state === 'open' || m.state === 'stalled');
        var stakeHost = document.createElement('div');
        note.appendChild(stakeHost);
        el.appendChild(note);

        if (!stakeable) {
          stakeHost.innerHTML = '<h2 style="font-size:1rem;margin-top:0">Staking</h2>' +
            (m.state === 'proposed'
              ? '<p class="fd-sub">This market is <strong>proposed</strong> — still in the listing pipeline. Staking opens once governance lists it. Read it now; nothing is at stake yet.</p>'
              : '<p class="fd-sub">This market is no longer open for staking.</p>');
        } else {
          // --- Stake flow (SPEC increment 3): connect → dial + side toggle → sign EIP-712 → POST /api/intent. 0 gas. ---
          stakeHost.innerHTML = '<h2 style="font-size:1rem;margin-top:0">Stake your Aura</h2>' +
            '<p class="fd-sub">Staking costs no gas: you sign an intent in your wallet, it is stored, and it locks in this Sunday\'s batch. <strong>Pending is not locked</strong> — if your balance changed by then, the batch can reject it (the reject list is public).</p>' +
            '<div class="fd-switch-wrap" style="margin:0.75rem 0"><button class="fd-switch" id="stake-side" role="switch" aria-checked="true" aria-label="Stake for"><span class="fd-switch-knob"></span></button><span id="stake-side-label" style="font-weight:600;color:var(--fd-for)">FOR</span></div>' +
            '<div id="stake-dial"></div>' +
            '<button class="fd-tab" id="stake-connect" style="margin-top:0.75rem">Connect wallet &amp; sign</button>' +
            '<p id="stake-status" class="fd-sub" role="status" style="margin-top:0.75rem"></p>';
          var status = stakeHost.querySelector('#stake-status');
          var sideFor = true;
          var sideBtn = stakeHost.querySelector('#stake-side');
          sideBtn.addEventListener('click', function () {
            sideFor = !sideFor;
            sideBtn.setAttribute('aria-checked', String(sideFor));
            var lbl = stakeHost.querySelector('#stake-side-label');
            lbl.textContent = sideFor ? 'FOR' : 'AGAINST';
            lbl.style.color = sideFor ? 'var(--fd-for)' : 'var(--fd-against)';
          });
          var dial = window.fdDial({ min: 10, max: 5000, value: 10, hint: 'Minimum 10 Aura. You can only stake one side per market.' });
          stakeHost.querySelector('#stake-dial').appendChild(dial);
          stakeHost.querySelector('#stake-connect').addEventListener('click', async function () {
            status.textContent = 'Connecting wallet…';
            try {
              var ethersMod = await import('https://cdn.jsdelivr.net/npm/ethers@6.13.4/+esm');
              if (!window.ethereum) { status.textContent = 'No wallet found in this browser. Install MetaMask (or any EIP-1193 wallet) to stake.'; return; }
              await window.ethereum.request({ method: 'eth_requestAccounts' });
              var provider = new ethersMod.BrowserProvider(window.ethereum);
              var signer = await provider.getSigner();
              var addr = await signer.getAddress();
              var network = await provider.getNetwork();
              if (Number(network.chainId) !== 11155420) {
                try { await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x8274f' }] }); }
                catch (e) { status.textContent = 'Please switch your wallet to OP Sepolia (testnet) to stake.'; return; }
              }
              status.textContent = 'Signing the stake intent in your wallet (0 gas)…';
              var domain = { name: 'FREEDAM Policy Market', version: '1', chainId: 11155420, verifyingContract: m.contract || '0x9af71751842C9fcE04e8f10473DDa43A8f9409B7' };
              var types = { Stake: [
                { name: 'marketId', type: 'string' }, { name: 'side', type: 'string' },
                { name: 'amount', type: 'uint256' }, { name: 'nonce', type: 'uint256' },
                { name: 'deadline', type: 'uint256' } ] };
              var intent = { marketId: m.id, side: sideFor ? 'for' : 'against', amount: dial.getValue(), nonce: Math.floor(Math.random() * 1e9), deadline: Math.floor(Date.now() / 1000) + 60 * 60 * 24 * 14 };
              var sig = await signer.signTypedData(domain, types, intent);
              status.textContent = 'Storing your signed intent…';
              var res = await fetch('/api/intent', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...intent, address: addr, signature: sig })
              });
              var out = await res.json();
              if (res.status === 201) {
                status.textContent = '✓ Signed and stored — pending. It locks in this Sunday\'s batch if your balance still covers it. Nothing else to do.';
                stakeHost.querySelector('#stake-connect').disabled = true;
              } else {
                status.textContent = 'Not stored (' + (out.error || res.status) + '): ' + (out.detail || 'check the market state and try again.');
              }
            } catch (err) {
              status.textContent = err && err.code === 'ACTION_REJECTED' ? 'Signature cancelled — nothing was stored.' : 'Could not complete staking: ' + (err.message || err);
            }
          });
        }
        root.innerHTML = '';
        root.appendChild(el);
      }).catch(function (err) {
        root.innerHTML = '<h1 class="fd-h1">Could not load market</h1><p class="fd-sub">' + err.message + ' — try the <a href="/data/markets.json">raw JSON</a>.</p>';
      });
    })();
  </script>
</body>
</html>
